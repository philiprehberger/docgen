<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.docgen.philiprehberger.com
    DocumentRoot /var/www/docgen/current/public

    <Directory /var/www/docgen/current/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/docgen-api-error.log
    CustomLog ${APACHE_LOG_DIR}/docgen-api-access.log combined

    # Run `sudo certbot --apache -d api.docgen.philiprehberger.com` to issue.
    # Certbot will append a redirect to https here and write the matching
    # -le-ssl.conf variant alongside.

SSLCertificateFile /etc/letsencrypt/live/docgen.philiprehberger.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/docgen.philiprehberger.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
