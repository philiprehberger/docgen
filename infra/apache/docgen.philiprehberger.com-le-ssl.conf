<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName docgen.philiprehberger.com

    # Certbot HTTP-01 challenge — served by Apache directly, NOT proxied.
    Alias /.well-known/acme-challenge /var/www/letsencrypt/.well-known/acme-challenge
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge !

    # Reverse-proxy to the PM2 Next.js docs site on port 3006.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3006/
    ProxyPassReverse / http://127.0.0.1:3006/

    # Long timeouts in case the try-it console renders a heavy template synchronously.
    ProxyTimeout 600

    ErrorLog ${APACHE_LOG_DIR}/docgen-web-error.log
    CustomLog ${APACHE_LOG_DIR}/docgen-web-access.log combined

    # Run `sudo certbot --apache -d docgen.philiprehberger.com` to issue.

SSLCertificateFile /etc/letsencrypt/live/docgen.philiprehberger.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/docgen.philiprehberger.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
