; Supervisord config for the production Horizon worker.
; Deploys to /etc/supervisor/conf.d/docgen-horizon.conf on the EC2 box.
; Reload with:  sudo supervisorctl reread && sudo supervisorctl update

[program:docgen-horizon]
process_name=%(program_name)s
command=php /var/www/docgen/current/artisan horizon
autostart=true
autorestart=true
user=ubuntu
redirect_stderr=true
stdout_logfile=/var/log/docgen/horizon.log
stopwaitsecs=3600
